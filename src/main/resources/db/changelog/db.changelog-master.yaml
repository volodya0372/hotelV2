databaseChangeLog:
  - changeSet:
      id: 1-create-hotels
      author: property-view
      changes:
        - createTable:
            tableName: hotels
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: name, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: description, type: VARCHAR(3000)}
              - column: {name: brand, type: VARCHAR(255)}
              - column: {name: house_number, type: INT}
              - column: {name: street, type: VARCHAR(255)}
              - column: {name: city, type: VARCHAR(255)}
              - column: {name: country, type: VARCHAR(255)}
              - column: {name: post_code, type: VARCHAR(255)}
              - column: {name: phone, type: VARCHAR(255)}
              - column: {name: email, type: VARCHAR(255)}
              - column: {name: check_in, type: TIME}
              - column: {name: check_out, type: TIME}
        - createTable:
            tableName: hotel_amenities
            columns:
              - column: {name: hotel_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_amenity_hotel, references: hotels(id)}}
              - column: {name: amenity, type: VARCHAR(255), constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: hotel_amenities
            columnNames: hotel_id, amenity
            constraintName: pk_hotel_amenities
